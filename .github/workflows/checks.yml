name: Lifely checks
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: lifely-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx expo install --check
      - run: npx expo export --platform all
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: lifely-playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 4
      - run: npm run test:e2e
        timeout-minutes: 5
