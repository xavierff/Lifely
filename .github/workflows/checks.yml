name: Lifely checks
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: lifely-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx expo install --check
      - run: npx expo export --platform all
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: lifely-playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright chromium with Ubuntu dependencies
        run: |
          # The preinstalled Microsoft apt mirror on hosted runners is unrelated
          # to Playwright and can return HTTP 403. Ignore only that mirror.
          for repo_file in /etc/apt/sources.list.d/*; do
            if [ -f "$repo_file" ] && grep -q 'packages.microsoft.com' "$repo_file"; then
              sudo mv "$repo_file" "$repo_file.disabled"
            fi
          done
          npx playwright install --with-deps chromium
        timeout-minutes: 4
      - run: npm run test:e2e
        timeout-minutes: 5
